[package]
name = "prompter"
version = "0.1.0"
edition = "2021"
description = "A floating, see-through script prompter for macOS"
license = "MIT"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "596dfdcf32d85d4d8d17a8887b4d0979ec7c5e14" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "596dfdcf32d85d4d8d17a8887b4d0979ec7c5e14", features = ["font-kit", "wayland", "x11", "runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
core-text = "21"
image = { version = "0.25.1", default-features = false }
objc2 = "0.6"
raw-window-handle = "0.6"
smallvec = "1.6"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
